<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicBot - Авторизация</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white bg-gradient-to-br from-blue-900 to-purple-800">

  <main class="w-full max-w-md p-4">
    <div class="auth-container bg-gray-800 rounded-lg p-6 shadow-lg">
      <h2 class="text-xl font-bold mb-4 text-center">Авторизация</h2>
      <div class="space-y-4">
        <input type="text" id="loginUsername" placeholder="Логин" class="w-full p-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500">
        <input type="password" id="loginPassword" placeholder="Пароль" class="w-full p-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500">
        <div class="text-center text-gray-300">
          <p>Или используйте другой способ входа</p>
          <button id="googleLogin" class="google-btn mt-2">
            <i class="fab fa-google mr-2"></i> Войти через Google
          </button>
        </div>
        <div class="flex justify-end space-x-2">
          <button id="loginSubmit" class="p-3 bg-purple-600 rounded-lg hover:bg-purple-700 transition-colors flex-1">Войти</button>
        </div>
      </div>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
